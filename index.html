<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REPORT-UNUSUALLY</title>
    
    <!-- Favicon Standar & Android -->
    <link rel="icon" href="https://pdftourl.net/images/1795338011001-78b16720-f38f-450a-8a33-3264f4a2eabc.png" type="image/png">
    
    <!-- Konfigurasi Khusus iPhone / iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="REPORT-UNUSUALLY">
    <link rel="apple-touch-icon" href="https://pdftourl.net/images/1795338011001-78b16720-f38f-450a-8a33-3264f4a2eabc.png">

    <!-- Konfigurasi Warna Tema Browser Android -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Placeholder Manifest PWA -->
    <link rel="manifest" id="pwa-manifest">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #eeeeee;
            overflow: hidden;
            overscroll-behavior-y: contain;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Splash Screen Kustom */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            width: 92px;
            height: 92px;
            object-fit: contain;
            border-radius: 20px;
            animation: pulse 1.6s ease-in-out infinite;
        }

        .splash-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #1f2937;
        }

        .splash-loader {
            width: 26px;
            height: 26px;
            border: 3px solid #e5e7eb;
            border-top-color: #111827;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 4px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .iframe-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Tampilan Splash Screen -->
    <div id="splash-screen">
        <img
            src="https://pdftourl.net/images/1795338011001-78b16720-f38f-450a-8a33-3264f4a2eabc.png"
            alt="Logo REPORT-UNUSUALLY"
            class="splash-logo"
        >
        <div class="splash-title">REPORT-UNUSUALLY</div>
        <div class="splash-loader"></div>
    </div>

    <div class="iframe-container">
        <iframe
            id="app"
            src="https://script.google.com/macros/s/AKfycbyA9-KouDfdeV-MDe5GFxAvXWD7Dynph2Gzn5U1TTlt1XBreNNQsYw9PPKGnEMaSSZLTA/exec"
            allow="fullscreen; camera; microphone; display-capture; geolocation">
        </iframe>
    </div>

    <script>
        // Membuat Web App Manifest secara dinamis
        const manifestData = {
            "name": "REPORT-UNUSUALLY",
            "short_name": "REPORT",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#ffffff",
            "icons": [
                {
                    "src": "https://pdftourl.net/images/1795338011001-78b16720-f38f-450a-8a33-3264f4a2eabc.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://pdftourl.net/images/1795338011001-78b16720-f38f-450a-8a33-3264f4a2eabc.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };

        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(blob);
        document.querySelector('#pwa-manifest').setAttribute('href', manifestURL);

        // Mengatur hilangnya splash screen setelah iframe siap (dengan batas waktu aman)
        const splash = document.getElementById('splash-screen');
        const iframe = document.getElementById('app');
        let isHidden = false;

        function hideSplash() {
            if (isHidden) return;
            isHidden = true;
            splash.classList.add('fade-out');
            setTimeout(() => {
                splash.remove();
            }, 450);
        }

        // Sembunyikan saat iframe selesai memuat
        iframe.addEventListener('load', () => {
            setTimeout(hideSplash, 500);
        });

        // Fallback maksimal 6 detik agar tidak nyangkut jika jaringan lambat atau event load terhambat
        setTimeout(hideSplash, 6000);
    </script>
</body>
</html>
